repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the `ruff==` pin in pyproject.toml's dev dependencies and with
    # the plugin CI's `uv tool install ruff==`. Three different versions on one config means
    # a rule can fire in one place and not exist in another.
    rev: v0.15.19
    hooks:
      - id: ruff-format
      - id: ruff

  - repo: local
    hooks:
      - id: single-package-commit
        name: Check single package per commit
        entry: uv run python .github/scripts/validate.py --hook
        language: system
        always_run: true
        pass_filenames: false

