[project]
name = "beadboard"
version = "0.0.0"
description = "Terminal UI for beads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artem Vasin", email = "nonameitem@me.com" }]
keywords = ["beads", "tui", "textual", "issue-tracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["textual>=8.2,<9"]

[project.scripts]
beadboard = "beadboard.cli:main"

[project.urls]
Homepage = "https://github.com/NoNameItem/claude-tools/tree/master/packages/beadboard"
Repository = "https://github.com/NoNameItem/claude-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beadboard"]
