# Scanner properties for the SonarCloud analysis of statuskit.
#
# The file must live here, not at the repository root: the scanner resolves
# `<sonar.projectBaseDir>/sonar-project.properties`, and the CI workflow sets
# `projectBaseDir: packages/statuskit` (_reusable-python-ci.yml, job `sonarcloud`).
#
# CLI arguments override this file, so nothing below may be repeated in that job's
# `args:` — a duplicated key there would silently win.
#
# Analysis settings (projectKey, sources, coverage report, ...) stay in the workflow;
# this file carries only the rule mutes, which need a written rationale next to them.
# See docs/superpowers/specs/2026-08-28-sonarcloud-quality-gate-design.md (D4).

sonar.issue.ignore.multicriteria=s1192,s107

# python:S1192 "String literals should not be duplicated" (MAINTAINABILITY/HIGH, threshold 3).
# Muted on substance: the rule asks for a repeated literal to be replaced by a constant, which
# costs readability — instead of the value itself the reader sees a name declared elsewhere.
# It matters here because HIGH blocks the merge under the `NoNameItem way` gate.
sonar.issue.ignore.multicriteria.s1192.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.s1192.resourceKey=**/*

# python:S107 "too many parameters" (MAINTAINABILITY/MEDIUM, max 13).
# Muted because it fires on constructors that initialise class fields, where a long parameter
# list is the normal shape. ruff's equivalent PLR0913 is disabled in pyproject.toml for the same
# reason. MEDIUM does not block the merge; this only keeps the finding out of the tracker.
sonar.issue.ignore.multicriteria.s107.ruleKey=python:S107
sonar.issue.ignore.multicriteria.s107.resourceKey=**/*
