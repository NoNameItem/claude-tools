# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  path_filters:
    - "!docs/plans/**"
    - "!.beads/**"
    - "!**/*.lock"
  auto_review:
    # Disabled: reviews are handled by Codex + Claude (see .github/workflows/).
    # Flip to true (or remove this line) to turn CodeRabbit auto-review back on.
    enabled: false
    labels:
      - "!autorelease: pending"
    base_branches:
      - "master"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
  fail_commit_status: true
  tools:
    ruff:
      enabled: false
    opengrep:
      # CodeRabbit fails to write its temp fallback config (.coderabbit-opengrep-fallback.yml
      # missing) and OpenGrep has no config_file knob, so it errors per-file with 0 findings.
      # Secret/security coverage stays via gitleaks + SonarCloud; lint/types run in CI.
      enabled: false
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
  path_instructions:
    - path: "packages/statuskit/**"
      instructions: |
        Python package for Claude Code statusline. Modular plugin architecture.
        Check for proper error handling, type hints, and module isolation.
    - path: "plugins/**/skills/**"
      instructions: |
        Claude Code skills (markdown with YAML frontmatter).
        Focus on clarity of instructions, completeness, and correct skill metadata.
    - path: "tests/**"
      instructions: |
        Pytest tests. Check for edge cases coverage and clear test naming.
    - path: ".github/workflows/**"
      instructions: |
        GitHub Actions CI/CD. Check for security best practices and job dependencies.
