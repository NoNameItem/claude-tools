name: Review Gate

# Blocks merge until Codex has reviewed the latest commit of a PR.
#
# Division of responsibility:
#   - Claude's review is gated separately by requiring its native `claude-review` check
#     (it re-runs on every push, so it carries the "latest commit reviewed" guarantee).
#   - Unresolved findings from either reviewer are gated by the repo's
#     "Require conversation resolution before merging" setting.
#   - This workflow only asserts that *Codex* has reviewed the head commit.
#
# Codex signals its state via reactions/reviews (no check run, no commit status):
#   - reviewing   -> 👀 (eyes) reaction on the PR, previous 👍 removed
#   - clean       -> 👍 (+1) reaction, re-added with a fresh timestamp
#   - has findings -> a PR review whose commit_id == head SHA (+ inline comments)
# Because a 👍 reaction fires no workflow event, the job polls until Codex settles.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read # reactions on a PR are read via the Issues API endpoint

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    # Same-repo PRs only — forked PRs get no Codex app review and can't be gated here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Codex to review the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CODEX_BOT='chatgpt-codex-connector[bot]'
          TIMEOUT=720    # ~12 min (observed Codex latency ~5-8 min)
          INTERVAL=30

          # Head commit time: lets us tell a *fresh* clean-review 👍 (re-added with a new
          # timestamp after re-review) from a stale 👍 left over from an earlier commit.
          # (Assumes the committer clock is roughly in sync with GitHub — true for NTP hosts.)
          head_time=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
          echo "PR #$PR head=$HEAD_SHA committed at $head_time"
          echo "Waiting for Codex ($CODEX_BOT): 👍 reaction (clean) or a review on the head (findings)."

          deadline=$(( $(date +%s) + TIMEOUT ))
          while :; do
            # Findings path: a Codex review pinned to the exact head SHA.
            # --paginate applies --jq per page, so emit ids and count lines (a per-page
            # `length` would only see the last page on a PR with >30 reviews).
            review_head=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq ".[] | select(.user.login==\"$CODEX_BOT\" and .commit_id==\"$HEAD_SHA\") | .id" | wc -l | tr -d ' ')
            # Clean path: a 👍 reaction newer than the head commit (Codex strips the old 👍
            # on every push and re-adds it after a clean re-review). Emit timestamps and take the
            # latest with sort|tail — a per-page `max` would miss a 👍 past the first 30 reactions.
            thumb_time=$(gh api --paginate "repos/$REPO/issues/$PR/reactions" \
              --jq ".[] | select(.user.login==\"$CODEX_BOT\" and .content==\"+1\") | .created_at" | sort | tail -n1)

            if [ "$review_head" -gt 0 ]; then
              echo "Codex reviewed $HEAD_SHA — gate open (findings, if any, are gated by conversation resolution)."
              exit 0
            fi
            if [ -n "$thumb_time" ] && [ "$thumb_time" \> "$head_time" ]; then
              echo "Codex 👍 at $thumb_time is newer than head commit — clean review, gate open."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Codex has not reviewed $HEAD_SHA within $((TIMEOUT / 60)) min. Re-run this check once Codex finishes (it shows 👀 while reviewing, then 👍 or a review)."
              exit 1
            fi
            echo "Not yet (review@head=$review_head, latest 👍=${thumb_time:-none}, need newer than $head_time). Sleeping ${INTERVAL}s…"
            sleep "$INTERVAL"
          done
