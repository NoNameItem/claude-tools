name: Review Gate

# Blocks merge until Codex has reviewed the latest commit of a PR.
#
# Division of responsibility:
#   - Claude's review is gated separately by requiring its native `claude-review` check
#     (it re-runs on every push, so it carries the "latest commit reviewed" guarantee).
#   - Unresolved findings from either reviewer are gated by the repo's
#     "Require conversation resolution before merging" setting.
#   - This workflow only asserts that *Codex* has reviewed the head commit.
#
# Codex signals its state via reactions/reviews (no check run, no commit status of its own):
#   - reviewing    -> 👀 (eyes) reaction on the PR, previous 👍 removed
#   - clean        -> 👍 (+1) reaction, re-added with a fresh timestamp
#   - has findings -> a PR review whose commit_id == head SHA (+ inline comments)
# Because a 👍 reaction fires no workflow event, the job polls until Codex settles. Whether the
# evidence is fresh enough (newer than the head's push time) is decided by review_gate.py.
#
# HOW THE REQUIRED CHECK IS PUBLISHED: the job POSTs a commit status with context `review-gate`
# to the PR *head* SHA (pending -> success/failure/error). The `master` ruleset requires the
# context `review-gate`, which is this status. We do NOT rely on the job's own check run: under
# `pull_request_target` that run is attributed to the base SHA (not the PR head), and a job
# skipped by `if:` reports "success" — either would let an unreviewed head look green. Posting
# an explicit status to the head SHA avoids both. The job name below is therefore deliberately
# NOT `review-gate`. NOTE: commit statuses are keyed by (SHA, context), not by PR — so only
# ever post `success` after confirming this run's evidence is for the PR's *current* head (a
# stale poll must not green a superseded SHA that another PR could reuse).
#
# SECURITY (pull_request_target): the workflow definition and review_gate.py always come from
# the BASE branch, so a PR that edits either cannot alter the gate guarding its own merge.
# This is SAFE ONLY because the job checks out the BASE branch (never the PR head) and reads
# PR metadata via `gh api`. NEVER add a checkout of `github.event.pull_request.head.*` or
# otherwise execute head code here. `statuses: write` only lets the job post a commit status.

on:
  # Only `opened`/`synchronize` — the events that define the head content. Deliberately excluded:
  #   - `reopened`: the head SHA's prior status persists; re-running risks laundering stale
  #     evidence into a green after a while-closed push (Codex #96 C1/C3).
  #   - `edited` / base change: base-change re-arm was dropped as a bottomless edge (Codex #96
  #     round-3). A base change leaves the prior status in place — an accepted limitation (rare
  #     on a trusted repo; human review + conversation-resolution still gate). See spec §10.
  #   - `ready_for_review`: no safe stateless freshness cutoff exists (updated_at is inflated,
  #     the committer date races a pre-push 👍). A draft is gated by its opened/synchronize
  #     runs; if it needs a fresh gate after being marked ready, push again or re-run. Spec §10.
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read
  issues: read # reactions on a PR are read via the Issues API endpoint
  statuses: write # POST the required `review-gate` status to the PR head SHA

# No `concurrency`: each run posts its status only to its own (frozen) HEAD_SHA, and only
# `opened`/`synchronize` trigger runs — so no two runs ever target the same head SHA, and a
# commit pushed mid-poll just starts a fresh run for the new SHA while the stale poll finishes
# harmlessly against the old SHA (and re-checks the head before posting success, so it can't
# green a superseded SHA). `cancel-in-progress: true` would instead risk an unrelated event
# cancelling a live poll and stranding its `pending` status.

jobs:
  # NOTE: name is NOT `review-gate` on purpose — the required check is the posted status, not
  # this job's own check run (see the HOW THE REQUIRED CHECK IS PUBLISHED note above).
  review-gate-poll:
    name: review-gate-poll
    # Same-repo PRs only. Forks can't be Codex-gated AND a fork run must not write a `success`
    # status to the base repo's head SHA (statuses are keyed by SHA/context, so it could green a
    # same-repo PR sharing that SHA — Codex #96 827). Skipping posts nothing, so a fork PR's
    # required `review-gate` stays missing (blocked) rather than falsely green.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out base-branch scripts
        # pull_request_target: with no `ref`, checkout takes the BASE branch (trusted), NOT the
        # PR head, so review_gate.py can't be swapped by the PR. Do NOT set
        # `ref: github.event.pull_request.head.sha` here — that would defeat the security fix.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Gate on Codex review of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # ~25 min (Codex latency ~5-8 min norm; weekend spikes ~14 min). COUPLING
          # INVARIANT (design §8): the review-loop helper wait_for_checks.py caps its
          # local wait at DEFAULT_WAIT_TIMEOUT=1800s (30 min) > this TIMEOUT + margin,
          # so a slow-but-live Codex review is never mistaken for a timeout. Keep both in sync.
          TIMEOUT=1500
          INTERVAL=30

          # POST the required `review-gate` commit status to the PR head SHA. $1=state $2=description.
          post_status() {
            gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" -f context="review-gate" -f description="$2" -f target_url="$RUN_URL" >/dev/null
          }

          # Ensure the head SHA never gets stranded at `pending`: if the run exits non-zero before
          # posting a terminal status (a transient gh/jq/python failure under `set -e`), post
          # `error` so branch protection reports a real, re-runnable failure instead of pending.
          RESULT_POSTED=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$RESULT_POSTED" = "0" ]; then post_status error "review-gate run failed — re-run this check" || true; fi' EXIT

          # release-please PRs are bot-generated version bumps / CHANGELOG / marketplace-ref
          # pins that Codex never reviews; Claude's review is waived too (claude-code-review.yml).
          # They stay gated by Python CI + conversation resolution + manual merge. Pass now,
          # before the poll loop. Detect by release-please's deterministic branch prefix; HEAD_REF
          # is read-only data (never checked out / executed), so reading it here is safe.
          if [[ "$HEAD_REF" == release-please--* ]]; then
            post_status success "release-please PR — AI review not required"
            RESULT_POSTED=1
            echo "release-please PR (head=$HEAD_REF) — review-gate waived."
            exit 0
          fi

          # Freshness cutoff = the head's push time. pull_request.updated_at is GitHub's own
          # clock, frozen in the event payload (correct across manual re-runs), and for
          # opened/synchronize it is exactly the push time — NOT the committer date, which can
          # predate an earlier commit's 👍 and let a stale reaction satisfy the gate.
          cutoff="$PUSHED_AT"
          echo "PR #$PR head=$HEAD_SHA cutoff=$cutoff"
          post_status pending "Waiting for Codex to review the head commit"

          deadline=$(( $(date +%s) + TIMEOUT ))
          while :; do
            # Fetch Codex's reviews and reactions (metadata only — no head checkout). --paginate
            # applies --jq per page and emits one array per page; `jq -s 'add // []'` merges them.
            reviews=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
              --jq '[.[] | {user: {login: .user.login}, commit_id, submitted_at}]' | jq -s 'add // []')
            reactions=$(gh api --paginate "repos/$REPO/issues/$PR/reactions" \
              --jq '[.[] | {user: {login: .user.login}, content, created_at}]' | jq -s 'add // []')
            payload=$(jq -n --argjson reviews "$reviews" --argjson reactions "$reactions" \
              '{reviews: $reviews, reactions: $reactions}')

            decision=$(printf '%s' "$payload" | python .github/scripts/review_gate.py \
              --cutoff "$cutoff" --head-sha "$HEAD_SHA")

            if [ "$decision" = "pass" ]; then
              # Guard against a stale poll: a Codex 👍 is PR-level (not SHA-pinned), so a poll for
              # an old head could accept a 👍 posted for a newer head. Only publish success if the
              # PR still points at the SHA this run gated — otherwise a superseded SHA (reusable by
              # another PR) would get a false green (Codex #96 831).
              current_head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
              # Guard on a non-empty result so a transient API blip isn't read as "moved" and
              # doesn't wrongly fail the current head.
              if [ -n "$current_head" ] && [ "$current_head" != "$HEAD_SHA" ]; then
                # Superseded: the PR advanced to a newer head while this poll ran. Clear the
                # `pending` posted earlier for this (now superseded) SHA with a terminal status,
                # so a PR that later uses this SHA isn't blocked on a stuck pending (Codex #96
                # round-5). A fresh run for this SHA (if it ever becomes a head again) overwrites it.
                post_status failure "Superseded — PR advanced to a newer head before this SHA was gated"
                RESULT_POSTED=1
                echo "PR head moved to $current_head (was $HEAD_SHA); poll superseded — posted failure to the old SHA."
                exit 0
              fi
              post_status success "Codex has reviewed the head commit"
              RESULT_POSTED=1
              echo "Codex has reviewed $HEAD_SHA — gate open (findings, if any, are gated by conversation resolution)."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              post_status failure "Codex has not reviewed the head commit in time — re-run after it finishes"
              RESULT_POSTED=1
              echo "::error::Codex has not reviewed $HEAD_SHA within $((TIMEOUT / 60)) min. This check is NOT re-triggered by Codex comments or reviews — re-run it here once Codex finishes (👀 while reviewing, then 👍 or a review)."
              exit 1
            fi
            echo "Not yet (decision=$decision). Sleeping ${INTERVAL}s…"
            sleep "$INTERVAL"
          done
