name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # persist-credentials intentionally left default (true): pin_marketplace_refs.py below
        # runs git operations using this checkout's persisted RELEASE_PLEASE_TOKEN credential.
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Pin marketplace refs in release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: python .github/scripts/pin_marketplace_refs.py
