# .github/workflows/_reusable-release-pr-summary.yml
name: Release PR Summary (Reusable)

# The notification for a release-please PR. It is a separate workflow from _reusable-pr-summary
# because almost nothing is shared: there is no start message (it would say nothing, and there is
# no thread to maintain), no anchor, no unresolved-thread verdict — only "did this force-push
# change anything about THIS component, and if so, what".
#
# Release-please force-pushes EVERY pending release PR on EVERY merge to master, and on a pure
# rebase the only change inside the CHANGELOG is the date in the section heading. Comparing the
# entry sets of the top section at `before` and `after` is what turns six messages per merge into
# one — see the design's Part 4.

on:
  workflow_call:
    inputs:
      pr-number:
        required: true
        type: number
      head-ref:
        description: 'PR head branch — the component name is encoded in it'
        required: true
        type: string
      before-sha:
        description: 'The head this push replaced; empty on `opened`, which always notifies'
        required: false
        type: string
        default: ''
      after-sha:
        required: true
        type: string
      checks-json:
        description: 'toJson(needs) from the caller — the gate results, for the verdict line'
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  summary:
    name: Release PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate the component's CHANGELOG
        id: locate
        env:
          HEAD_REF: ${{ inputs.head-ref }}
        run: |
          set -euo pipefail
          path=$(python3 .github/scripts/changelog_section.py path \
            --config release-please-config.json --branch "$HEAD_REF")
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG for $HEAD_REF: ${path:-<unknown component>}"

      # `?ref=<sha>` returns content even for a commit made unreachable by a force-push, which is
      # exactly the case here: `before` no longer belongs to any branch.
      - name: Read the CHANGELOG at both revisions
        id: read
        if: steps.locate.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANGELOG: ${{ steps.locate.outputs.path }}
          BEFORE_SHA: ${{ inputs.before-sha }}
          AFTER_SHA: ${{ inputs.after-sha }}
        run: |
          set -euo pipefail

          fetch() {
            gh api "repos/$REPO/contents/${CHANGELOG}?ref=$1" \
              -H "Accept: application/vnd.github.raw" > "$2" || : > "$2"
          }

          fetch "$AFTER_SHA" after.md
          if [ -n "$BEFORE_SHA" ]; then
            fetch "$BEFORE_SHA" before.md
            changed=$(python3 .github/scripts/changelog_section.py changed \
              --before before.md --after after.md)
          else
            # `opened`: there is no previous revision to compare against, and a new release PR is
            # always worth one message.
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Changelog entries changed: $changed"

      - name: Build the notification
        id: spec
        if: steps.read.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          NEEDS_JSON: ${{ inputs.checks-json }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/pulls/$PR")
          # Through GITHUB_OUTPUT-free env only: the title is bot-written here, but the same
          # discipline as _reusable-pr-summary.yml — never interpolate it into a `run:` block.
          title=$(printf '%s' "$pr" | jq -r '.title')
          url=$(printf '%s' "$pr" | jq -r '.html_url')

          # The verdict line, from the caller's gate results. `skipped` is green: it means the
          # job had nothing to do.
          failed=$(printf '%s' "$NEEDS_JSON" | jq -c '
            {"validate-pr": "Validate PR",
             "python-ci-result": "Python CI Gate",
             "claude-code-plugin-ci-result": "Claude Code Plugin CI Gate",
             "review-gate-result": "Review Gate"} as $labels
            | [to_entries[]
               | select($labels[.key] != null)
               | select(.value.result == "failure" or .value.result == "cancelled")
               | $labels[.key]]')

          if [ "$(printf '%s' "$failed" | jq 'length')" -gt 0 ]; then
            STATUS=failed
            verdict=$(printf '%s' "$failed" | jq -c '
              [{text: "Checks failed: "}]
              + ([to_entries[]
                  | if .key > 0 then [{text: ", "}, {text: .value, bold: true}]
                    else [{text: .value, bold: true}] end] | add)')
          else
            STATUS=ready
            verdict='[{"text": "Ready to merge"}]'
          fi

          # The entries of the new version, rendered by the converter release notifications
          # already use — it handles release-please markdown and its own Telegram budgets.
          python3 .github/scripts/changelog_section.py section < after.md > section.json
          jq -r '.entries[]? // empty' section.json \
            | python3 .github/scripts/release_notes.py > notes.json

          jq -n \
            --arg status "$STATUS" \
            --arg title "$title" \
            --argjson verdict "$verdict" \
            --slurpfile notes notes.json \
            --arg footer "${REPO##*/} · PR ${PR}" \
            --arg url "$url" \
            '{status: $status, title: $title, verdict: $verdict,
              blocks: (if (($notes[0].html // "") == "") then []
                       else [{type: "html", title: "Changelog", html: $notes[0].html}] end),
              footer: $footer,
              buttons: [{text: "Pull request", url: $url}],
              silent: false,
              reply_to: null}' > spec.json

          jq -c '{status, blocks: [.blocks[].title]}' spec.json

      - name: Send the notification
        if: steps.read.outputs.changed == 'true'
        uses: ./.github/actions/telegram-notify
        with:
          spec-file: spec.json
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
