# .github/workflows/push.yml
name: Push

on:
  push:
    branches: [master]

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read  # For fetching failed jobs in notifications

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release merge carries versions, CHANGELOG entries and marketplace pins — it does not change
  # the state of master in any meaningful way, and the manifests were already validated on the
  # release PR. So it gets no push pair; the release notifications (Publishing… / Published to
  # PyPI) are the ones that carry information.
  #
  # CI itself is NOT switched off: `-Dsonar.projectVersion` is set in _reusable-python-ci.yml, so
  # the VERSION event in SonarCloud is registered precisely by this run, and publish-badges hangs
  # off the same jobs.
  release-merge:
    name: Detect a release merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is-release: ${{ steps.detect.outputs.is-release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: detect
        env:
          # The whole push, not just its head: under a rebase merge the manifest can sit one
          # commit behind the head (the flow release PR carries a pin commit on top).
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          set -euo pipefail
          is_release=$(printf '%s' "$COMMITS" | python3 .github/scripts/release_merge.py)
          echo "is-release=$is_release" >> "$GITHUB_OUTPUT"
          echo "Release merge: $is_release"

  notify-start:
    name: Notify Start
    needs: [release-merge]
    if: needs.release-merge.outputs.is-release != 'true'
    runs-on: ubuntu-latest
    outputs:
      message-id: ${{ steps.notify.outputs.message-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: commit-info
        run: |
          # The heredoc delimiter is randomised: a commit subject that happens to equal a fixed
          # delimiter (e.g. exactly "COMMIT_MSG_EOF") would close the heredoc early and corrupt
          # $GITHUB_OUTPUT.
          delimiter="COMMIT_MSG_$(openssl rand -hex 8)"
          {
            echo "message<<$delimiter"
            git log -1 --pretty=%s
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: notify
        uses: ./.github/actions/telegram-notify
        with:
          status: started
          event-type: push
          title: ${{ steps.commit-info.outputs.message }}
          event-url: ${{ github.event.head_commit.url }}
          message: "Pushed to master · ${{ steps.commit-info.outputs.short-sha }}"
          footer: "${{ github.event.repository.name }} · master"
          silent: 'true'
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  detect:
    uses: ./.github/workflows/_reusable-detect.yml
    with:
      ref: HEAD~1..HEAD

  validate-commits:
    name: Validate commits
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate commits
        env:
          DETECT_RESULT: ${{ needs.detect.outputs.result }}
        run: |
          python .github/scripts/validate.py --commits \
            ${{ github.event.before }} \
            ${{ github.sha }}

  python-ci:
    name: Python CI
    needs: [detect, validate-commits]
    if: fromJson(needs.detect.outputs.result).by_type.python.has_changed == true
    uses: ./.github/workflows/_reusable-python-ci.yml
    with:
      matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.matrix) }}
      test-matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.test_matrix) }}
      changed-files: ${{ toJson(fromJson(needs.detect.outputs.result).changed_files) }}
      tooling-changed: ${{ fromJson(needs.detect.outputs.result).tooling_changed }}
    secrets: inherit

  claude-code-plugin-ci:
    name: Claude Code Plugin CI
    needs: [detect, validate-commits]
    if: fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.has_changed == true
    uses: ./.github/workflows/_reusable-claude-code-plugin-ci.yml
    with:
      plugins: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.changed) }}
      changed-files: ${{ toJson(fromJson(needs.detect.outputs.result).changed_files) }}
      tooling-changed: ${{ fromJson(needs.detect.outputs.result).tooling_changed }}

  python-ci-info:
    name: Python CI (info)
    needs: [detect, validate-commits]
    if: |
      fromJson(needs.detect.outputs.result).tooling_changed == true &&
      fromJson(needs.detect.outputs.result).by_type.python.has_unchanged == true
    uses: ./.github/workflows/_reusable-python-ci.yml
    with:
      matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.unchanged_matrix) }}
      test-matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.unchanged_test_matrix) }}
      tooling-changed: true
      info-only: true
    secrets: inherit

  claude-code-plugin-ci-info:
    name: Claude Code Plugin CI (info)
    needs: [detect, validate-commits]
    if: |
      fromJson(needs.detect.outputs.result).tooling_changed == true &&
      fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.has_unchanged == true
    uses: ./.github/workflows/_reusable-claude-code-plugin-ci.yml
    with:
      plugins: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.unchanged) }}
      tooling-changed: true

  publish-badges:
    name: Publish badges
    needs: [detect, python-ci, claude-code-plugin-ci, python-ci-info, claude-code-plugin-ci-info]
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # persist-credentials intentionally left default (true) on both checkouts below: the
      # "Commit and push" step runs `git commit` + `git push` in badges-data using the
      # credential actions/checkout persisted there. Do not add persist-credentials: false here.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main
      - name: Checkout badges-data
        uses: actions/checkout@v4
        with:
          ref: badges-data
          path: badges-data
      - name: Update badge files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main/.github/scripts/publish_badges.py --output-dir badges-data
      - name: Commit and push
        working-directory: badges-data
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No badge changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(badges): update CI status [skip ci]"
          git push

  notify-finish:
    name: Notify Finish
    needs: [notify-start, detect, validate-commits, python-ci, claude-code-plugin-ci, release-merge]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: commit-info
        run: |
          # The heredoc delimiter is randomised: a commit subject that happens to equal a fixed
          # delimiter (e.g. exactly "COMMIT_MSG_EOF") would close the heredoc early and corrupt
          # $GITHUB_OUTPUT.
          delimiter="COMMIT_MSG_$(openssl rand -hex 8)"
          {
            echo "message<<$delimiter"
            git log -1 --pretty=%s
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build the notification spec
        id: spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TITLE: ${{ steps.commit-info.outputs.message }}
          FOOTER: "${{ github.event.repository.name }} · master"
          REPLY_TO: ${{ needs.notify-start.outputs.message-id }}
          NEEDS_JSON: ${{ toJson(needs) }}
          DETECT_RESULT: ${{ needs.detect.outputs.result }}
        run: |
          set -euo pipefail

          # 1. Check table from the gating jobs' results. `skipped` is green: it means the job
          #    had nothing to do (no Python changes, no plugin changes).
          rows=$(printf '%s' "$NEEDS_JSON" | jq -c '
            {"detect": "Detect changes",
             "validate-commits": "Validate commits",
             "python-ci": "Python CI",
             "claude-code-plugin-ci": "Claude Code Plugin CI"} as $labels
            | [to_entries[]
               | select($labels[.key] != null)
               | (if .value.result == "failure" then {icon: "❌", bold: true}
                  elif .value.result == "cancelled" then {icon: "⛔", bold: true}
                  else {icon: "✅", bold: false} end) as $s
               | [{text: $labels[.key], bold: $s.bold},
                  {text: $s.icon, align: "center"}]]')

          failed_names=$(printf '%s' "$rows" | jq -c '[.[] | select(.[0].bold) | .[0].text]')

          if [ "$(printf '%s' "$failed_names" | jq 'length')" -gt 0 ]; then
            STATUS=failed
            # Interleave ", " separators so the bold lands on the job names and nothing else.
            verdict=$(printf '%s' "$failed_names" | jq -c '
              [{text: "Checks failed: "}]
              + ([to_entries[]
                  | if .key > 0 then [{text: ", "}, {text: .value, bold: true}]
                    else [{text: .value, bold: true}] end] | add)')
          else
            STATUS=ready
            verdict='[{"text": "All checks passed"}]'
          fi

          # 2. Failed child jobs, straight from this run.
          failed_jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]' | jq -s 'add // [] | .[:20]')

          # 3. Sonar reports the OVERALL state of the branch here, not new code: the new-code
          #    period on master only becomes meaningful once projectVersion has seeded a version
          #    history, and accumulated problems are visible nowhere else.
          keys=$(printf '%s' "$DETECT_RESULT" \
            | jq -c '[.by_type.python.matrix.include[]?.project] | map("NoNameItem_" + .)')
          python3 .github/scripts/sonar_pr_status.py \
            --mode branch --branch master --project-keys "$keys" > sonar.json

          # 4. Assemble.
          jq -n \
            --arg status "$STATUS" \
            --arg title "$TITLE" \
            --argjson verdict "$verdict" \
            --argjson rows "$rows" \
            --argjson failed_jobs "$failed_jobs" \
            --slurpfile sonar sonar.json \
            --arg footer "$FOOTER" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --arg reply_to "$REPLY_TO" \
            '{status: $status, title: $title, verdict: $verdict,
              blocks: ([if $status == "failed"
                        then {type: "table", rows: $rows}
                        else {type: "table", title: "All checks passed", rows: $rows} end]
                       + (if ($failed_jobs | length) > 0
                          then [{type: "list",
                                 title: ("Failed jobs: " + ($failed_jobs | length | tostring)),
                                 open: true,
                                 items: [$failed_jobs[] | [{text: ., bold: true}]]}]
                          else [] end)
                       + $sonar[0]),
              footer: $footer,
              buttons: ([{text: "Commit", url: $commit_url}]
                        + (if $status == "failed" then [{text: "Run", url: $run_url}] else [] end)),
              silent: false,
              reply_to: (if $reply_to == "" then null else ($reply_to | tonumber) end)}' > spec.json

          jq -c '{status, blocks: [.blocks[].title]}' spec.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Send the notification
        # On a release merge only a FAILURE is worth a message: a flaky test, an unreachable
        # SonarCloud or an infrastructure hiccup would otherwise be announced nowhere while the
        # release message cheerfully reports success. The green path stays silent.
        if: |
          needs.release-merge.outputs.is-release != 'true' ||
          steps.spec.outputs.status == 'failed'
        uses: ./.github/actions/telegram-notify
        with:
          spec-file: spec.json
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
