# .github/workflows/_reusable-python-ci.yml
name: Python CI (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix with packages (from detect output)'
        required: true
        type: string
      test-matrix:
        description: 'JSON flat test matrix (project × python combinations)'
        required: true
        type: string
      changed-files:
        description: 'JSON map of project -> files'
        required: false
        type: string
        default: '{}'
      tooling-changed:
        description: 'Whether tooling files changed'
        required: false
        type: boolean
        default: false
      info-only:
        description: 'Skip SonarCloud (for info jobs)'
        required: false
        type: boolean
        default: false
      qualitygate-wait:
        description: 'Block the job on the SonarCloud quality gate (true on PRs, false on push — see the release-gate design, D2)'
        required: false
        type: boolean
        default: true

jobs:
  lint:
    name: Lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get minimum Python version
        id: py-version
        env:
          PY_VERSIONS: ${{ toJson(matrix.python-versions) }}
        run: |
          MIN_PY=$(jq -r '.[0]' <<< "$PY_VERSIONS")
          echo "version=$MIN_PY" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ steps.py-version.outputs.version }}

      # The `-name` values below are plain, with no project suffix, and deliberately so: reviewdog
      # only honors `-name` for formats that carry no tool name of their own. `ruff check`'s rdjson
      # embeds `"source": {"name": "ruff"}` and ty_to_rdjsonl.py writes `"source": {"name": "ty"}`,
      # both of which win over the flag (verified in #131: the `-f=diff` format step was labelled
      # `ruff-format (flow)` while the rdjson lint step came out as plain `ruff`), so a suffix
      # would apply to some pipelines and not others — worse than none. It buys little anyway:
      # these names only become check run names under the `github-check` reporter on a push, they
      # are not required contexts (see docs/merge-gate-rollout.md), and python CI and plugin CI
      # only lint in the same run when a root tooling file changes (`tooling_files` in
      # pyproject.toml — pyproject.toml, uv.lock, sonar-project.properties; a change under
      # .github/ is repo-level but NOT tooling_changed).
      #
      # Every pipeline below opens with `set -o pipefail` because the default shell is
      # `bash -e {0}` — `-e` WITHOUT pipefail, so a pipeline's status is the LAST command's. Should
      # ruff or ty abort without parseable output (broken config, crash, missing file), reviewdog
      # would see zero diagnostics, exit 0, and the step would be recorded as success — a silently
      # green lint job. On the ordinary path nothing changes: with real findings reviewdog already
      # fails through `-fail-level=any`.
      - uses: reviewdog/action-setup@v1

      - name: Install dependencies
        run: uv sync

      # Every workflow value reaches the script through `env:`, never through `${{ }}`
      # inside `run:`. CHANGED_FILES is built from the PR's own file names
      # (.github/scripts/detect_changes.py), and git allows `'` and `$` in a path — so
      # interpolating it here would let a crafted file name run arbitrary shell.
      - name: Filter Python files
        id: filter
        env:
          PROJECT: ${{ matrix.project }}
          PROJECT_PATH: ${{ matrix.path }}
          CHANGED_FILES: ${{ inputs.changed-files }}
          TOOLING_CHANGED: ${{ inputs.tooling-changed }}
        run: |
          if [ "$TOOLING_CHANGED" == "true" ] || [ "$CHANGED_FILES" == "{}" ]; then
            # Lint all Python files in package
            echo "py_files=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          else
            # Lint only changed Python files
            PY_FILES=$(echo "$CHANGED_FILES" | jq -r --arg p "$PROJECT" '.[$p] // [] | .[] | select(endswith(".py"))' | tr '\n' ' ')
            if [ -z "$PY_FILES" ]; then
              echo "py_files=" >> "$GITHUB_OUTPUT"
            else
              echo "py_files=$PY_FILES" >> "$GITHUB_OUTPUT"
            fi
          fi

      # `read -r -a` is what splits PY_FILES back into one argument per file: it applies
      # word splitting only, so — unlike an unquoted expansion — a file named `a*.py`
      # cannot glob against the work tree, and nothing in the value is ever re-parsed
      # as shell. The step's `if:` guarantees the array is non-empty.
      - name: Ruff format check
        id: format
        if: steps.filter.outputs.py_files != ''
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          REVIEWDOG_REPORTER: ${{ github.event.pull_request && 'github-pr-review' || 'github-check' }}
          PY_FILES: ${{ steps.filter.outputs.py_files }}
        run: |
          set -o pipefail
          read -r -a FILES <<< "$PY_FILES"
          uv run ruff format --diff -- "${FILES[@]}" | \
            reviewdog -f=diff -f.diff.strip=0 -name="ruff-format" -reporter="${REVIEWDOG_REPORTER}" -filter-mode=nofilter -fail-level=any

      - name: Ruff lint
        id: lint
        if: steps.filter.outputs.py_files != ''
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          REVIEWDOG_REPORTER: ${{ github.event.pull_request && 'github-pr-review' || 'github-check' }}
          PY_FILES: ${{ steps.filter.outputs.py_files }}
        run: |
          set -o pipefail
          read -r -a FILES <<< "$PY_FILES"
          uv run ruff check --output-format=rdjson -- "${FILES[@]}" 2>&1 | \
            reviewdog -f=rdjson -name="ruff" -reporter="${REVIEWDOG_REPORTER}" -filter-mode=nofilter -fail-level=any

      - name: Type check
        id: typecheck
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          REVIEWDOG_REPORTER: ${{ github.event.pull_request && 'github-pr-review' || 'github-check' }}
        run: |
          set -o pipefail
          uv run ty check --output-format concise 2>&1 | \
            python "$GITHUB_WORKSPACE/.github/scripts/ty_to_rdjsonl.py" | \
            reviewdog -f=rdjsonl -name="ty" -reporter="${REVIEWDOG_REPORTER}" -filter-mode=nofilter -fail-level=any
        working-directory: ${{ matrix.path }}

      - name: Check results
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          failed=false
          if [ "$FORMAT_OUTCOME" == "failure" ]; then
            echo "::error::Ruff format check failed"
            failed=true
          fi
          if [ "$LINT_OUTCOME" == "failure" ]; then
            echo "::error::Ruff lint failed"
            failed=true
          fi
          if [ "$TYPECHECK_OUTCOME" == "failure" ]; then
            echo "::error::Type check failed"
            failed=true
          fi
          if [ "$failed" == "true" ]; then
            exit 1
          fi

  test:
    name: Test (${{ matrix.project }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      # The explicit `tests` path keeps this per-package job scoped: the repo-root
      # testpaths also covers plugins/ and .github/scripts/, and pytest resolves its
      # rootdir (and testpaths) to the repo root even when run from the package dir.
      - name: Run tests
        run: uv run pytest tests --cov=src --cov-report=xml --junitxml=pytest-results.xml
        working-directory: ${{ matrix.path }}

      - name: Get minimum Python version
        id: min-py
        env:
          PY_VERSIONS: ${{ toJson(matrix.python-versions) }}
        run: |
          MIN_PY=$(jq -r '.[0]' <<< "$PY_VERSIONS")
          echo "version=$MIN_PY" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: matrix.python == steps.min-py.outputs.version
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.path }}/coverage.xml
          retention-days: 30

      - name: Publish coverage report
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: ${{ matrix.path }}/coverage.xml
          junitxml-path: ${{ matrix.path }}/pytest-results.xml
          title: 'Tests: ${{ matrix.project }} (py${{ matrix.python }})'
          badge-title: '${{ matrix.project }} py${{ matrix.python }}'
          unique-id-for-comment: ${{ matrix.project }}-py${{ matrix.python }}
          coverage-path-prefix: ${{ matrix.path }}/
          default-branch: master
          report-only-changed-files: true

      - name: Publish test details
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: 'Test Details: ${{ matrix.project }} (py${{ matrix.python }})'
          path: ${{ matrix.path }}/pytest-results.xml
          reporter: java-junit

  sonarcloud:
    name: SonarCloud (${{ matrix.project }})
    needs: [lint, test]
    if: |
      inputs.info-only == false &&
      (github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.path }}

      - name: Read project version
        id: version
        working-directory: ${{ matrix.path }}
        run: |
          VERSION=$(python3 -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Analysing as version $VERSION"

      # `sonar.qualitygate.wait` makes this job the blocking Sonar verdict: the scanner polls until
      # the Quality Gate is computed (~25 s) and exits non-zero on ERROR, which reddens
      # `Python CI Gate`. Accepted cost: CI now depends on SonarCloud availability.
      # `pr.yml` leaves it `true` — that is the merge gate. `push.yml` passes `false`: a push to
      # master is a BRANCH analysis, where the gate's overall conditions are evaluated too, and
      # failing the job for accumulated debt would punish master for exactly what the release-gate
      # design permits there (D2). The overall verdict is enforced on the release PR instead.
      # Fork PRs are unaffected — this job is already skipped there (see the `if:` above).
      - uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.path }}
          args: >
            -Dsonar.projectKey=NoNameItem_${{ matrix.project }}
            -Dsonar.organization=nonameitem
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
            -Dsonar.python.version=${{ join(matrix.python-versions, ',') }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/tests/**,**/conftest.py
            -Dsonar.qualitygate.wait=${{ inputs.qualitygate-wait }}
