# .github/workflows/_reusable-pr-summary.yml
name: PR Summary (Reusable)

# Sends the "result" Telegram notification for a PR — the one that says whether the PR is
# mergeable. Called from BOTH producers of required checks:
#   * pr.yml            — after Validate PR + the two CI gates
#   * review-gate.yml   — after the Codex gate posts its commit status
# Neither can see the other's completion (a status posted with GITHUB_TOKEN starts no workflow
# run, so `on: status` cannot observe our own gate). So both call this, and pr_summary.py makes
# every call but the last one silent.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'PR number'
        required: true
        type: number
      head-sha:
        description: 'PR head SHA — all state is keyed by it'
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true
      SONAR_TOKEN:
        required: false

permissions:
  contents: read
  checks: read
  statuses: write
  pull-requests: read

jobs:
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialises the two possible simultaneous calls for one head SHA. `cancel-in-progress:
    # false` — a cancelled call would be a lost notification, not a saved minute.
    concurrency:
      group: pr-summary-${{ inputs.head-sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect head SHA state
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/pulls/$PR")
          current_head=$(printf '%s' "$pr" | jq -r '.head.sha // ""')
          is_fork=$(printf '%s' "$pr" | jq --arg repo "$REPO" '.head.repo.full_name != $repo')

          # The ruleset drives both the merge gate and this notification: one edit changes both.
          # A failed READ of the ruleset must not be confused with a ruleset that legitimately
          # requires nothing: the former has to fail this step loudly (no notification this run
          # is safer than a false "Ready to merge" built from an empty required-contexts list),
          # the latter is a real `[]` that flows on unchanged. So the request and the extraction
          # are two separate steps: capture the raw body and check the command's exit status
          # first, then run the (unchanged) jq extraction over the captured body.
          #
          # `--paginate` for the same reason the read has to fail loudly: this endpoint pages at
          # 30, and every ruleset on `master` contributes its own rule entries. A truncated first
          # page that drops the `required_status_checks` rule yields an empty required list —
          # which `pr_summary.decide()` reads as "nothing to require" and reports as
          # "Ready to merge". `--jq` runs per page, so `jq -s 'add // []'` re-joins the pages.
          if ! rules_json=$(gh api --paginate "repos/$REPO/rules/branches/master" --jq '.' \
                              | jq -s 'add // []'); then
            echo "::error::Failed to read repos/$REPO/rules/branches/master (required-status-checks ruleset) — cannot compute a merge verdict without it" >&2
            exit 1
          fi
          required=$(printf '%s' "$rules_json" \
            | jq -c '[.[] | select(.type == "required_status_checks")
                          | .parameters.required_status_checks[].context]')

          # Paged at 30 like every list endpoint here. A truncated page makes a required context
          # look like it was never reported, which parks the PR at `waiting` forever — and it
          # would also drop the two notification markers read below, breaking dedup and the
          # reply anchor.
          statuses=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | {context, state, target_url, description}]' \
            | jq -s 'add // []')

          # No `filter` param here, so the endpoint defaults to `filter=latest`: each check-run
          # name already arrives as exactly one entry, and pr_summary.py's `by_run`/`_latest`
          # per-name grouping is defensive, not load-bearing, for exactly that reason (see its
          # docstrings). Passing `filter=all` here would change what pr_summary.py has to handle
          # — multiple entries per name — and must come with matching test coverage there.
          # `id` is selected because `_latest`'s tie-break reads it.
          check_runs=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs" \
            --jq '[.check_runs[] | {id, name, status, conclusion, started_at, html_url,
                                    app_slug: .app.slug, details_url, output_title: .output.title}]' \
            | jq -s 'add // []')

          # REST does not expose isResolved on review threads — GraphQL is the only source.
          # Cursor-paginated: a bare `first: 100` silently caps the count, and every thread past
          # the cap is an unresolved comment the verdict would not know about — i.e. a PR reported
          # as "Ready to merge" while findings are still open. `gh --paginate` drives the loop
          # itself, given an `$endCursor` variable and a `pageInfo` selection; `--jq` runs per
          # page, so the per-page counts are summed with `jq -s 'add // 0'`.
          unresolved=$(gh api graphql --paginate \
            -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR" \
            -f query='query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100, after: $endCursor) {
                    nodes { isResolved }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' \
            | jq -s 'add // 0')

          # Two markers, two writers, two roles — see the "Record the verdict" step at the bottom
          # of this file and the anchor step in pr.yml:
          #   pr-notify-anchor  — `msg:<id>`, written ONLY by notify-start, on every PR update.
          #                       Names the newest "checks running" message to reply to.
          #   pr-notify-verdict — `msg:<anchor-id> v:<verdict>`, written ONLY by this workflow.
          #                       Says which verdict was already reported, and FOR WHICH anchor.
          anchor=$(printf '%s' "$statuses" \
            | jq -r 'map(select(.context == "pr-notify-anchor")) | first | .description // ""')
          verdict_marker=$(printf '%s' "$statuses" \
            | jq -r 'map(select(.context == "pr-notify-verdict")) | first | .description // ""')

          printf '%s' "$check_runs" > check-runs.json
          jq -n \
            --arg head_sha "$HEAD_SHA" \
            --arg current_head "$current_head" \
            --argjson is_fork "$is_fork" \
            --argjson required "$required" \
            --argjson statuses "$statuses" \
            --argjson check_runs "$check_runs" \
            --argjson unresolved "$unresolved" \
            --arg anchor "$anchor" \
            --arg verdict_marker "$verdict_marker" \
            '{head_sha: $head_sha, current_head_sha: $current_head, is_fork: $is_fork,
              required_contexts: $required, statuses: $statuses, check_runs: $check_runs,
              unresolved_threads: $unresolved, anchor_description: $anchor,
              verdict_description: $verdict_marker}' > payload.json

          # PR title and URL go through GITHUB_OUTPUT, never through inline GitHub Actions
          # interpolation in a `run:` block: this workflow is also called from
          # pull_request_target, where the title is attacker controlled. The next step reads
          # them as env vars.
          #
          # The heredoc delimiter is randomised (GitHub's own guidance for untrusted values):
          # a title containing a line that happens to equal a fixed delimiter would terminate
          # the heredoc early and corrupt $GITHUB_OUTPUT.
          delimiter="PR_TITLE_$(openssl rand -hex 8)"
          {
            echo "title<<$delimiter"
            printf '%s' "$pr" | jq -r '.title'
            echo "$delimiter"
            echo "url=$(printf '%s' "$pr" | jq -r '.html_url')"
          } >> "$GITHUB_OUTPUT"

      - name: Decide the verdict
        id: decide
        env:
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          TITLE: ${{ steps.collect.outputs.title }}
          URL: ${{ steps.collect.outputs.url }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          # `--opt=value`, not `--opt value`: PR_TITLE is attacker-controlled under
          # pull_request_target and can legally start with `-` (e.g. `-- WIP`), which argparse
          # would otherwise parse as an option and exit 2, silently losing the notification.
          python3 .github/scripts/pr_summary.py \
            --title="$TITLE" \
            --url="$URL" \
            --footer="${REPO##*/} · PR ${PR}" \
            --checks-url="${SERVER}/${REPO}/pull/${PR}/checks" \
            < payload.json > summary.json

          jq -r '"send=\(.send)", "verdict=\(.verdict)", "message-id=\(.message_id // "")", "reason=\(.reason)"' \
            summary.json >> "$GITHUB_OUTPUT"
          echo "Decision: $(jq -c '{send, reason, verdict}' summary.json)"

      - name: Build Sonar blocks and the final spec
        if: steps.decide.outputs.send == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          python3 .github/scripts/sonar_pr_status.py \
            --mode pr --pr "$PR" --check-runs-file check-runs.json > sonar.json
          jq --slurpfile sonar sonar.json '.spec | .blocks += $sonar[0]' summary.json > spec.json

      - name: Send the notification
        id: send
        if: steps.decide.outputs.send == 'true'
        uses: ./.github/actions/telegram-notify
        with:
          spec-file: spec.json
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Record the verdict in the pr-notify-verdict marker
        if: steps.decide.outputs.send == 'true' && steps.send.outputs.message-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          VERDICT: ${{ steps.decide.outputs.verdict }}
          ANCHOR_ID: ${{ steps.decide.outputs.message-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # This context is written ONLY here, and `pr-notify-anchor` ONLY by pr.yml's notify-start
          # — so the two writers never collide and neither needs a read-before-write guard.
          #
          # The recorded anchor id is what makes dedup reset per PR update rather than per head
          # SHA. `decide()` treats a verdict as already-reported only when the anchor it was
          # recorded FOR is still the current one: an `edited` event sends a fresh "checks running"
          # message and moves the anchor, so the same verdict is reported again — against the new
          # message — instead of being swallowed as a duplicate and leaving that message hanging.
          #
          # ANCHOR_ID is empty only when no anchor exists at all — notify-start had not written one
          # yet when this call ran. Then the verdict is recorded WITHOUT an `msg:` field rather
          # than with the id of the message just sent: this workflow does not own the anchor
          # context, so an id it invented would not be an anchor, and `decide()` would later read
          # the real anchor's arrival as an anchor CHANGE and re-send the same verdict. A missing
          # `msg:` says exactly what happened — "recorded while no anchor was known" — and
          # `decide()` treats it as compatible with any anchor.
          if [ -n "$ANCHOR_ID" ]; then
            DESCRIPTION="msg:${ANCHOR_ID} v:${VERDICT}"
          else
            DESCRIPTION="v:${VERDICT}"
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=pr-notify-verdict \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL" >/dev/null
          echo "Marker: $DESCRIPTION"
