name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip forked PRs: a fork's pull_request run has no access to repo secrets
    # (CLAUDE_CODE_OAUTH_TOKEN would be empty), so the job would just fail. The same
    # applies to Dependabot PRs (same-repo, but secret-less), so skip those too.
    # You can AND additional author filters here, e.g.
    # github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Waive review for release-please PR
        # release-please PRs are bot-generated version bumps / CHANGELOG / marketplace-ref
        # pins with no review value; Codex is waived too (review-gate.yml). This step runs
        # only for them so the job still concludes success and the required `claude-review`
        # check stays green without invoking the Claude action. HEAD_REF is passed via env
        # (never spliced into the command) to avoid shell injection from the branch name.
        if: ${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: echo "release-please PR ($HEAD_REF) — Claude review not required; job passes to satisfy the required 'claude-review' check."

      - name: Checkout repository
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

