# .github/workflows/_reusable-claude-code-plugin-ci.yml
name: Claude Code Plugin CI (Reusable)

on:
  workflow_call:
    inputs:
      plugins:
        description: 'JSON array of plugin names'
        required: true
        type: string
      changed-files:
        description: 'JSON map of project -> files'
        required: false
        type: string
        default: '{}'
      tooling-changed:
        description: 'Whether tooling files changed'
        required: false
        type: boolean
        default: false
      manifests-only:
        description: >-
          Run only validate-structure. Set for release-please PRs: the release commit rewrites
          plugin.json, .codex-plugin/plugin.json and both marketplace.json files, and
          validate_plugin.py checking their consistency is the only check capable of catching an
          error release-please itself made. Lint and tests would run against unchanged code.
        required: false
        type: boolean
        default: false

jobs:
  validate-structure:
    name: Validate (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(inputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate plugin structure
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          EXTRA_ARGS=()
          if [ "$PLUGIN" = "flow" ]; then
            EXTRA_ARGS+=(--require-codex-manifest)
          fi
          python .github/scripts/validate_plugin.py "${EXTRA_ARGS[@]}" "plugins/$PLUGIN"

      # flow skills must never call AskUserQuestion: its dialog auto-submits the
      # pre-selected option after the AFK idle timeout (CLAUDE_AFK_TIMEOUT_MS,
      # default 60s; harness v2.1.198+), which for branch/push/status prompts is
      # an irreversible action taken without the user's consent. Ask via
      # plain-text numbered prompts instead (template: flow:continue Step 7b).
      # See claude-tools-6q4.
      - name: Flow skills must not use AskUserQuestion (AFK auto-submit guard)
        if: matrix.plugin == 'flow'
        run: |
          if grep -rn "AskUserQuestion" plugins/flow/skills/; then
            echo "::error::flow skills must not reference AskUserQuestion — it auto-submits on the AFK idle timeout (CLAUDE_AFK_TIMEOUT_MS, default 60s), performing branch/push/status actions without consent. Use plain-text numbered prompts (template: flow:continue Step 7b). See claude-tools-6q4."
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.plugin }})
    if: inputs.manifests-only == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(inputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for Python files
        id: check-python
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          if find "plugins/$PLUGIN" -name "*.py" 2>/dev/null | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check-python.outputs.has_python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        if: steps.check-python.outputs.has_python == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install ruff
        if: steps.check-python.outputs.has_python == 'true'
        run: uv tool install ruff

      # Every workflow value reaches the script through `env:`, never through `${{ }}`
      # inside `run:`. CHANGED_FILES is built from the PR's own file names
      # (.github/scripts/detect_changes.py), and git allows `'` and `$` in a path — so
      # interpolating it here would let a crafted file name run arbitrary shell.
      - name: Determine files to lint
        if: steps.check-python.outputs.has_python == 'true'
        id: files
        env:
          PLUGIN: ${{ matrix.plugin }}
          CHANGED_FILES: ${{ inputs.changed-files }}
          TOOLING_CHANGED: ${{ inputs.tooling-changed }}
        run: |
          if [ "$TOOLING_CHANGED" == "true" ] || [ "$CHANGED_FILES" == "{}" ]; then
            # Lint all Python files in plugin
            echo "files=plugins/$PLUGIN" >> "$GITHUB_OUTPUT"
          else
            # Lint only changed Python files
            PY_FILES=$(echo "$CHANGED_FILES" |
              jq -r --arg p "$PLUGIN" \
                '.[$p] // [] | .[] |
                 select(
                   endswith(".py") or
                   test("/bin/flow-[^/]+$") or
                   test("/hooks/(session-start|codex-pre-tool-use)$")
                 )' |
              tr '\n' ' ')
            if [ -z "$PY_FILES" ]; then
              echo "files=" >> "$GITHUB_OUTPUT"
            else
              echo "files=$PY_FILES" >> "$GITHUB_OUTPUT"
            fi
          fi

      # `read -r -a` is what splits LINT_FILES back into one argument per file: it applies
      # word splitting only, so — unlike an unquoted expansion — a file named `a*.py`
      # cannot glob against the work tree, and nothing in the value is ever re-parsed
      # as shell. The step's `if:` guarantees the array is non-empty.
      - name: Ruff format check
        if: steps.check-python.outputs.has_python == 'true' && steps.files.outputs.files != ''
        env:
          LINT_FILES: ${{ steps.files.outputs.files }}
        run: |
          read -r -a FILES <<< "$LINT_FILES"
          ruff format --config pyproject.toml --check -- "${FILES[@]}"

      - name: Ruff lint
        if: steps.check-python.outputs.has_python == 'true' && steps.files.outputs.files != ''
        env:
          LINT_FILES: ${{ steps.files.outputs.files }}
        run: |
          read -r -a FILES <<< "$LINT_FILES"
          ruff check --config pyproject.toml -- "${FILES[@]}"

  test:
    name: Test (${{ matrix.plugin }})
    if: inputs.manifests-only == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(inputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for plugin tests
        id: check-tests
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          if [ -d "plugins/$PLUGIN/bin/tests" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check-tests.outputs.has_tests == 'true'
        run: uv sync

      - name: Run tests
        if: steps.check-tests.outputs.has_tests == 'true'
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: uv run pytest "plugins/$PLUGIN/bin/tests"
