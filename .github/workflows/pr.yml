# .github/workflows/pr.yml
name: PR

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Deliberately NO workflow-level `statuses: write`. The pr-notify marker is written by exactly
# two jobs (notify-start and pr-summary), and each grants itself that permission at job level.
# Every OTHER job here runs PR-authored code: this workflow triggers on `pull_request`, so
# actions/checkout takes the PR merge ref, and validate-pr / python-ci / claude-code-plugin-ci
# execute scripts from it. A workflow-level grant would hand that code the ability to forge
# commit statuses — including `review-gate` and `pr-notify`, which the master ruleset requires.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true
  # Note: github.event.action separates synchronize/edited into different groups
  # so they don't cancel each other (needed for release-please PRs)

jobs:
  notify-start:
    name: Notify Start
    # Same fork guard as the pr-summary job below, for the same reason: this job reads
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID directly, and GitHub withholds repository secrets from
    # fork-origin runs — so without the guard every external contribution turns this job red
    # instead of quietly skipping the notification.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level set for this job, so everything this job
    # needs is listed here — `contents: read` for the checkout below, and `statuses: write` for
    # the pr-notify marker. Nothing PR-authored runs in this job.
    permissions:
      contents: read
      statuses: write
    # Deliberately NOT in _reusable-pr-summary.yml's `pr-summary-<sha>` concurrency group, even
    # though this job writes the same `pr-notify` status. Sharing it would only narrow the
    # read-write window in the "Check for a recorded verdict" step below — that step is the actual
    # fix — while costing far more: a queued job is cancelled outright as soon as a third claimant
    # joins its group (`cancel-in-progress: false` protects only the job already running). That
    # would take this whole job with it, including the Telegram send above, which needs no
    # serialisation at all and has no retry. A lost start notification is a worse failure than the
    # duplicate result message the residual window can cause.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compose the verdict line
        id: verdict
        env:
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # `edited` changes the title or body, not the head — saying "New commit" would lie.
          if [ "$ACTION" = "edited" ]; then
            JSON='[{"text": "PR updated, checks running"}]'
          else
            JSON=$(jq -nc --arg sha "${HEAD_SHA:0:7}" \
              '[{text: "New commit "}, {text: $sha, code: true}, {text: ", checks running"}]')
          fi
          echo "json=$JSON" >> "$GITHUB_OUTPUT"

      - id: notify
        uses: ./.github/actions/telegram-notify
        with:
          status: started
          event-type: pr
          title: ${{ github.event.pull_request.title }}
          event-url: ${{ github.event.pull_request.html_url }}
          verdict-json: ${{ steps.verdict.outputs.json }}
          footer: "${{ github.event.repository.name }} · PR ${{ github.event.pull_request.number }}"
          silent: 'true'
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

      # This is the ACTUAL fix for the race described above: read the marker that's there right
      # now, and skip the write if it already carries a recorded verdict (`v:...`). Without this,
      # a POST here always becomes the newest `pr-notify` status — including one that lands AFTER
      # _reusable-pr-summary.yml recorded a verdict, which would erase it, make `pr_summary.decide()`
      # see no previous verdict on the next run, and send a duplicate result notification. The
      # most reachable trigger isn't a scheduler race: `pr.yml` also fires on `edited`, and editing
      # the PR title/body after checks are green re-runs this job.
      #
      # A read-then-write is not atomic, so a verdict recorded in the gap between the read and the
      # POST below is still lost. That residual is accepted deliberately: GitHub's commit-status API
      # has no conditional/compare-and-swap write, and the only way to serialise this job against
      # the summary — sharing its concurrency group — risks losing the whole job instead (see the
      # note on the job above). The residual costs a duplicate message; the alternative costs a
      # missing one.
      - name: Check for a recorded verdict
        id: check-verdict
        if: steps.notify.outputs.message-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Mirrors _reusable-pr-summary.yml's "Collect head SHA state" read of the same endpoint,
          # including the --paginate / jq -s 'add // []' re-join: this list pages at 30, and a
          # truncated first page could drop the pr-notify status and make a recorded verdict look
          # absent.
          description=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "pr-notify") | .description]' \
            | jq -s 'add // []' \
            | jq -r 'first // ""')

          if [[ "$description" == *" v:"* ]]; then
            echo "A verdict is already recorded ($description) — skipping the pending write so it is not erased."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The marker is how the result notification (sent from a different workflow run) finds the
      # message to reply to. `pending` until a verdict is recorded; the description is the state.
      - name: Create the pr-notify marker
        if: steps.notify.outputs.message-id != '' && steps.check-verdict.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MSG_ID: ${{ steps.notify.outputs.message-id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context=pr-notify \
            -f description="msg:${MSG_ID}" -f target_url="$RUN_URL" >/dev/null

  detect:
    uses: ./.github/workflows/_reusable-detect.yml
    with:
      ref: origin/${{ github.base_ref }}..HEAD

  validate-pr:
    name: Validate PR
    needs: [detect]
    # `detect` carries no `if:` guard, so it always runs; without `always()` here, a failed or
    # cancelled `detect` would make this job SKIPPED rather than failed — and `skipped` is a
    # green required context, so the merge gate would wave the PR through with no validation.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check detect result
        env:
          RESULT: ${{ needs.detect.result }}
        run: |
          echo "Detect result: $RESULT"
          case "$RESULT" in
            success) exit 0 ;;
            *) exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          DETECT_RESULT: ${{ needs.detect.outputs.result }}
        run: python .github/scripts/validate.py --pr

  python-ci:
    name: Python CI
    needs: [detect, validate-pr]
    if: fromJson(needs.detect.outputs.result).by_type.python.has_changed == true
    uses: ./.github/workflows/_reusable-python-ci.yml
    with:
      matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.matrix) }}
      test-matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.test_matrix) }}
      changed-files: ${{ toJson(fromJson(needs.detect.outputs.result).changed_files) }}
      tooling-changed: ${{ fromJson(needs.detect.outputs.result).tooling_changed }}
    secrets: inherit

  claude-code-plugin-ci:
    name: Claude Code Plugin CI
    needs: [detect, validate-pr]
    if: fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.has_changed == true
    uses: ./.github/workflows/_reusable-claude-code-plugin-ci.yml
    with:
      plugins: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.changed) }}
      changed-files: ${{ toJson(fromJson(needs.detect.outputs.result).changed_files) }}
      tooling-changed: ${{ fromJson(needs.detect.outputs.result).tooling_changed }}

  python-ci-info:
    name: Python CI (info)
    needs: [detect, validate-pr]
    if: |
      fromJson(needs.detect.outputs.result).tooling_changed == true &&
      fromJson(needs.detect.outputs.result).by_type.python.has_unchanged == true
    uses: ./.github/workflows/_reusable-python-ci.yml
    with:
      matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.unchanged_matrix) }}
      test-matrix: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.python.unchanged_test_matrix) }}
      tooling-changed: true
      info-only: true
    secrets: inherit

  claude-code-plugin-ci-info:
    name: Claude Code Plugin CI (info)
    needs: [detect, validate-pr]
    if: |
      fromJson(needs.detect.outputs.result).tooling_changed == true &&
      fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.has_unchanged == true
    uses: ./.github/workflows/_reusable-claude-code-plugin-ci.yml
    with:
      plugins: ${{ toJson(fromJson(needs.detect.outputs.result).by_type.claude_code_plugin.unchanged) }}
      tooling-changed: true

  # Gate jobs for the master ruleset's required status checks.
  # When reusable workflows run, they create sub-jobs like "Python CI / Lint (statuskit)"
  # but not a parent "Python CI" check run — and the skipped call itself also publishes a
  # check run named "Python CI", so that name matches two runs. These `if: always()` summary
  # jobs publish an unambiguous, always-present context for the ruleset to require.
  python-ci-result:
    name: Python CI Gate
    needs: [python-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.python-ci.result }}
        run: |
          echo "Python CI result: $RESULT"
          # Anything but success/skipped is red — including `cancelled`, so a cancelled run
          # can never read as a passing gate (that would bypass the merge gate entirely).
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  claude-code-plugin-ci-result:
    name: Claude Code Plugin CI Gate
    needs: [claude-code-plugin-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.claude-code-plugin-ci.result }}
        run: |
          echo "Claude Code Plugin CI result: $RESULT"
          # Anything but success/skipped is red — including `cancelled`, so a cancelled run
          # can never read as a passing gate (that would bypass the merge gate entirely).
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac

  # The result notification. This is only ONE of the two producers of required checks — the
  # other is review-gate.yml, which makes the same call. pr_summary.py silences whichever call
  # arrives while the other producer is still running.
  pr-summary:
    name: PR Summary
    needs: [notify-start, validate-pr, python-ci-result, claude-code-plugin-ci-result]
    # Fork guard, matching review-gate.yml's pr-summary job: a fork-origin PR gets no repository
    # secrets from `secrets: inherit`, so TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID would be empty and
    # the send step would fail outright instead of just skipping the notification.
    if: |
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Must mirror _reusable-pr-summary.yml's own `permissions:` block: a called workflow's
    # effective permissions are the INTERSECTION of what it declares and what the caller job
    # holds, so anything missing here is silently withheld from it — and without `statuses:
    # write` the summary could not record its verdict on the head SHA at all.
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: read
    uses: ./.github/workflows/_reusable-pr-summary.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
