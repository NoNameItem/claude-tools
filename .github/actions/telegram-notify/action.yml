name: 'Telegram Notify'
description: 'Send a CI notification to Telegram as a rich message'

# Thin wrapper over .github/scripts/telegram_notify.py. Two ways to call it:
#   * `spec-file` — a full notify spec built by pr_summary.py / a workflow (tables, Sonar
#     blocks, release notes). Everything else is ignored.
#   * the flat inputs below — a block-less message (the "started" notifications).
# The caller must have checked the repository out; the script is stdlib-only, so no setup step
# is needed.

inputs:
  spec-file:
    description: 'Path to a JSON notify spec. Wins over every flat input below.'
    required: false
    default: ''
  status:
    description: 'started | ready | comments | failed | cancelled | released | success | failure'
    required: false
    default: 'started'
  event-type:
    description: 'pr | push | release — only picks the default button label'
    required: false
    default: 'pr'
  title:
    description: 'Message heading (PR title, commit subject, release name)'
    required: false
    default: ''
  message:
    description: 'The verdict line under the heading (plain text)'
    required: false
    default: ''
  verdict-json:
    description: 'JSON segment array for the verdict line; wins over `message` (carries bold / code)'
    required: false
    default: ''
  event-url:
    description: 'URL for the default button'
    required: false
    default: ''
  footer:
    description: 'Footer line; defaults to the repository name'
    required: false
    default: ''
  buttons:
    description: 'JSON array of {text, url}; overrides the default button'
    required: false
    default: ''
  silent:
    description: 'true -> send without a notification sound'
    required: false
    default: 'false'
  reply-to:
    description: 'Telegram message_id to reply to'
    required: false
    default: ''
  collect-failed-jobs:
    description: 'Deprecated and ignored — failed jobs now arrive in the spec file'
    required: false
    default: 'false'
  token:
    description: 'Telegram bot token'
    required: true
  chat-id:
    description: 'Telegram chat ID'
    required: true

outputs:
  message-id:
    description: 'Telegram message_id of the sent message (empty when sending failed)'
    value: ${{ steps.notify.outputs.message-id }}

runs:
  using: 'composite'
  steps:
    - name: Send Telegram notification
      id: notify
      shell: bash
      env:
        NOTIFY_SPEC_FILE: ${{ inputs.spec-file }}
        NOTIFY_STATUS: ${{ inputs.status }}
        NOTIFY_TITLE: ${{ inputs.title }}
        NOTIFY_VERDICT: ${{ inputs.message }}
        NOTIFY_VERDICT_JSON: ${{ inputs.verdict-json }}
        NOTIFY_FOOTER: ${{ inputs.footer }}
        NOTIFY_BUTTONS: ${{ inputs.buttons }}
        NOTIFY_SILENT: ${{ inputs.silent }}
        NOTIFY_REPLY_TO: ${{ inputs.reply-to }}
        TELEGRAM_TOKEN: ${{ inputs.token }}
        TELEGRAM_CHAT_ID: ${{ inputs.chat-id }}
        EVENT_TYPE: ${{ inputs.event-type }}
        EVENT_URL: ${{ inputs.event-url }}
      run: |
        set -euo pipefail

        # Defaults for the flat path only; a spec-file carries its own footer and buttons.
        if [ -z "$NOTIFY_SPEC_FILE" ]; then
          if [ -z "$NOTIFY_FOOTER" ]; then
            NOTIFY_FOOTER="${GITHUB_REPOSITORY##*/}"
          fi
          if [ -z "$NOTIFY_BUTTONS" ] && [ -n "$EVENT_URL" ]; then
            case "$EVENT_TYPE" in
              push)    LABEL="Commit" ;;
              release) LABEL="Release" ;;
              *)       LABEL="Pull request" ;;
            esac
            NOTIFY_BUTTONS=$(jq -nc --arg text "$LABEL" --arg url "$EVENT_URL" '[{text: $text, url: $url}]')
          fi
          export NOTIFY_FOOTER NOTIFY_BUTTONS
        fi

        python3 "${GITHUB_WORKSPACE}/.github/scripts/telegram_notify.py"
